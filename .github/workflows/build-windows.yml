name: 윈도우 앱 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r desktop/requirements.txt pyinstaller

      - name: exe 빌드
        working-directory: desktop
        run: pyinstaller --noconfirm --onefile --windowed --name Hanbeonde --hidden-import pystray._win32 --add-data "words.json;." --add-data "web;web" hanbeonde_tray.py

      - name: exe 올리기
        uses: actions/upload-artifact@v4
        with:
          name: hanbeonde-windows
          path: desktop/dist/Hanbeonde.exe

      - name: 릴리스에 올리기
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          gh release view windows --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create windows --repo "$GITHUB_REPOSITORY" --title "한 번 더 윈도우 앱 + 크롬 확장" --notes "Hanbeonde.exe: 카카오톡 PC 등 PC 메신저용 트레이 앱. hanbeonde-chrome-extension.zip: 압축을 풀고 chrome://extensions 에서 '압축해제된 확장 프로그램을 로드'로 설치."
          gh release upload windows desktop/dist/Hanbeonde.exe --clobber --repo "$GITHUB_REPOSITORY"
          cd chrome-extension && 7z a ../hanbeonde-chrome-extension.zip . >/dev/null && cd ..
          gh release upload windows hanbeonde-chrome-extension.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 크롬 확장 올리기
        uses: actions/upload-artifact@v4
        with:
          name: hanbeonde-chrome-extension
          path: chrome-extension/
