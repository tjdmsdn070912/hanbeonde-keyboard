name: 안드로이드 APK 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: hanbeonde-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 릴리스에 올리기 (휴대폰에서 바로 내려받기)
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Hanbeonde.apk
          gh release view android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android --repo "$GITHUB_REPOSITORY" --title "한 번 더 안드로이드 키보드" --notes "최신 main 기준으로 자동으로 만든 APK예요. 휴대폰에서 Hanbeonde.apk 를 눌러 내려받아 설치하세요."
          gh release upload android Hanbeonde.apk --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
